[package]
name = "diffdrop"
version = "0.1.0"
description = "Compare two text files"
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "diffdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
diff-core = { path = "../crates/diff-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-cli = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"
sys-locale = "0.3"
window-vibrancy = "0.8"
tauri-plugin-single-instance = "2.5"
